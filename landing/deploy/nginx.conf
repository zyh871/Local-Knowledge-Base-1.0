# 智鲸 AI 产品介绍页 · Nginx 站点配置
#
# 用法：把本文件放到 /etc/nginx/conf.d/ 或 sites-enabled/，
#      修改 root 指向包含 index.html 的目录，然后 nginx -t && nginx -s reload。
#
# 该站点只有一个静态文件，配置刻意保持最小。

server {
    listen       80;
    listen  [::]:80;
    server_name  _;

    # 指向页面所在目录（部署时替换为真实路径）
    root  /var/www/zhijing-landing;
    index index.html;

    charset utf-8;

    # 单文件页面没有必要开目录列表
    autoindex off;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 页面内联了 logo，体积约 92 KB；gzip 后约 20 KB
    gzip              on;
    gzip_types        text/html text/css application/javascript image/svg+xml;
    gzip_min_length   1024;
    gzip_comp_level   6;

    # 单文件页面没有指纹文件名，用 ETag 协商缓存即可
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Frame-Options SAMEORIGIN always;
        etag on;
    }

    access_log off;

    # 页面没有任何外链资源，CSP 可以收得很紧
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; base-uri 'none'; form-action 'none'" always;
}
