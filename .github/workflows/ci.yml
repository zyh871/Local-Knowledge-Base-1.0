name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: 安装依赖
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-cov pytest-timeout

      - name: 单元 + 集成测试
        working-directory: backend
        # 超时兜底：一条卡死的用例不该拖垮整轮
        run: pytest -q --timeout=180 --basetemp=./_pytmp

      - name: 冒烟集
        working-directory: backend
        run: pytest -m smoke -q --timeout=120

      - name: 覆盖率基线
        working-directory: backend
        # fail_under 先设 0：先把真实数字跑出来，再抬阈值。
        # 没有门禁的覆盖率只是一个印象。
        run: pytest -q --cov=app --cov-report=xml --cov-report=term --timeout=180

      - name: 上传覆盖率
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage.xml

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        working-directory: frontend
        run: npm ci

      - name: 单元测试
        working-directory: frontend
        run: npm run test:unit

      - name: 构建
        working-directory: frontend
        run: npm run build

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 凭据泄露扫描（gitleaks）
        # 仓库里曾经出现过 30 个文件硬编码管理员口令、`.env.example` 里
        # 带着可用的 JWT 密钥 —— 这条门禁就是为了不让它再回来。
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 依赖漏洞扫描（pip-audit）
        working-directory: backend
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt --strict || true

      - name: 静态安全扫描（bandit）
        working-directory: backend
        # 先出报告不阻断；确认基线后再改成阻断。
        run: |
          pip install bandit
          bandit -r app -ll -o bandit.json || true

      - name: 上传安全报告
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-reports
          path: backend/bandit.json
