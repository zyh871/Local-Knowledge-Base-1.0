name: rag-system

# ============================================================
#  本地知识库问答系统 - Docker Compose 配置
#  使用：docker compose up -d
#  停止：docker compose down
#  查看日志：docker compose logs -f
# ============================================================

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: rag-backend:latest
    container_name: rag-backend
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - backend_data:/app/data
      - backend_chroma:/app/chroma_db
      - backend_logs:/app/logs
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
      - DATA_PATH=/app/data
      - CHROMA_PERSIST_DIR=/app/chroma_db
      - LOG_DIR=/app/logs
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost,http://localhost:80,http://127.0.0.1}
    networks:
      - rag-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 1G

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    image: rag-frontend:latest
    container_name: rag-frontend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - rag-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/nginx-health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M

networks:
  rag-network:
    driver: bridge
    name: rag-network

volumes:
  backend_data:
    name: rag-backend-data
  backend_chroma:
    name: rag-backend-chroma
  backend_logs:
    name: rag-backend-logs
